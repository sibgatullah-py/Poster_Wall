{% extends 'layout.html' %}

{% block title %}My Profile{% endblock title %}

{% block content %}

<div class="min-h-[80vh] flex items-center justify-center px-4">

    <div class="w-full max-w-md bg-white rounded-2xl shadow-xl p-6">

        <!-- Header -->
        <div class="text-center mb-6">
            <h2 class="text-3xl font-bold text-blue-600">My Profile</h2>
            <p class="text-gray-400 text-sm">Manage your account</p>
        </div>

        <!-- Profile Image -->
        <div class="flex flex-col items-center mb-6">

            {% if user.image %}
                <img id="avatarPreview"
                     src="{{ user.image.url }}"
                     class="w-28 h-28 rounded-full object-cover border-4 border-blue-500 shadow mb-3">
            {% else %}
                <div id="avatarPreview"
                     class="w-28 h-28 rounded-full bg-blue-600 flex items-center justify-center
                            text-white text-4xl font-bold mb-3">
                    {{ user.username|first|upper }}
                </div>
            {% endif %}

            <label for="id_image"
                   class="cursor-pointer text-sm text-blue-600 hover:underline">
                Change profile picture
            </label>
        </div>

        <!-- Profile Form -->
        <form method="POST" enctype="multipart/form-data" class="space-y-5">
            {% csrf_token %}

            <!-- Hidden file input -->
            <input type="file" name="image" id="id_image" class="hidden">

            <!-- Username -->
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">
                    Username
                </label>
                <input type="text"
                       name="username"
                       value="{{ user.username }}"
                       class="w-full px-4 py-2 border rounded-xl text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>

            <!-- Buttons -->
            <div class="flex flex-col gap-3 pt-2">

                <button type="submit"
                        class="w-full bg-blue-600 text-white py-2.5 rounded-xl font-semibold
                               hover:bg-blue-700 transition shadow">
                    Save Changes
                </button>

                <form method="POST" action="{% url 'logout' %}">
                    {% csrf_token %}
                    <button class="w-full bg-red-100 text-red-600 py-2.5 rounded-xl font-semibold
                                   hover:bg-red-200 transition">
                        Logout
                    </button>
                </form>

            </div>
        </form>

    </div>

</div>

<!-- Live Avatar Preview -->
<script>
const input = document.getElementById("id_image");
const preview = document.getElementById("avatarPreview");

if (input) {
    input.addEventListener("change", function () {
        const file = this.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function (e) {
                if (preview.tagName === "IMG") {
                    preview.src = e.target.result;
                } else {
                    preview.style.backgroundImage = `url(${e.target.result})`;
                    preview.textContent = "";
                    preview.classList.add("bg-cover","bg-center");
                }
            }
            reader.readAsDataURL(file);
        }
    });
}
</script>

{% endblock content %}
